  title: "4. Le concept d'atouts et de contraintes",
  html: `
    <p>Posseder une ressource dans son sous-sol n'est ni un hasard sans consequence, ni une garantie automatique de richesse. C'est un <strong>atout spatial</strong> : un element du territoire qui favorise le developpement des activites humaines. A l'inverse, l'absence de cette ressource, ou la difficulte a l'exploiter, constitue une <strong>contrainte spatiale</strong>.</p>
    <div class="callout">
      Un meme element peut etre un atout pour une activite et une contrainte pour une autre. Un relief tres montagneux est une contrainte pour l'agriculture, mais peut etre un atout pour l'hydroelectricite (barrages, denivele).
    </div>
    <h3>Deux situations contrastees</h3>
    <div id="theory-map-4"></div>
    <p><strong>La Norvege</strong> dispose d'importantes reserves de petrole et de gaz en mer du Nord, decouvertes a la fin des annees 1960. Son relief tres accidente, fait de fjords profonds, est une contrainte pour les infrastructures terrestres, mais un atout pour la production d'hydroelectricite. Ces deux atouts combines expliquent pourquoi la Norvege exporte une grande partie de son energie plutot que d'en dependre.</p>
    <p><strong>La Belgique</strong>, a l'inverse, ne dispose pratiquement d'aucune reserve exploitable de petrole ou de gaz naturel dans son sous-sol. Elle importe la quasi-totalite de l'energie fossile qu'elle consomme. C'est une contrainte structurelle qui pousse le pays a diversifier ses sources (nucleaire, eolien en mer du Nord, importations par pipeline et par bateau).</p>
    <div class="callout piege">
      <strong>Piege frequent :</strong> « atout » et « contrainte » ne sont pas des jugements de valeur sur un pays (« riche » ou « pauvre », « bien » ou « mal »). Ce sont des caracteristiques spatiales objectives que l'on peut observer et decrire, independamment du niveau de developpement du pays.
