const theorySlides = [
{

  html: `
    <p>Un meme espace peut interesser plusieurs acteurs, avec des intentions differentes. Ce module etudie ce qui se passe quand ces interets deviennent incompatibles : le <strong>conflit d'usage</strong>. Il approfondit aussi les concepts de <strong>developpement</strong> et de <strong>developpement durable</strong> vus en 5e, appliques cette fois a l'amenagement du territoire.</p>
    <div class="callout">
      <strong>A la fin de ce module, tu seras capable de :</strong>
      <ul class="clean">
        <li>definir la notion de conflit d'usage ;</li>
        <li>identifier les acteurs concernes par un amenagement et leurs intentions ;</li>
        <li>mettre en evidence les effets d'un amenagement sur l'environnement en termes de developpement et de developpement durable ;</li>
        <li>analyser un cas belge concret : l'aeroport de Bruxelles-National.</li>
      </ul>
    </div>
  `
},
{
  title: "2. Le concept de conflit d'usage",
  html: `
    <div class="callout">
      <strong class="term" data-def="Un conflit d'usage, c'est une situation dans laquelle plusieurs fonctions ou plusieurs acteurs revendiquent un meme espace pour des usages incompatibles entre eux.">Conflit d'usage</strong> : situation dans laquelle plusieurs fonctions ou plusieurs acteurs revendiquent un meme espace pour des usages incompatibles entre eux.
    </div>
    <p>Un conflit d'usage nait presque toujours de la rencontre entre plusieurs <strong>acteurs</strong> aux <strong>intentions</strong> differentes.</p>
    <table class="data">
      <tr><th>Type d'acteur</th><th>Intention typique</th></tr>
      <tr><td>Pouvoirs publics (Etat, Region, commune)</td><td>Developper l'emploi et l'economie, assurer des services, arbitrer entre les autres acteurs.</td></tr>
      <tr><td>Entreprises / promoteurs</td><td>Rentabiliser un investissement, developper une activite economique.</td></tr>
      <tr><td>Habitants / riverains</td><td>Preserver leur cadre de vie (calme, qualite de l'air, paysage, valeur immobiliere).</td></tr>
      <tr><td>Associations environnementales</td><td>Proteger les ecosystemes et les ressources pour le long terme.</td></tr>
    </table>
    <div class="callout piege">
      <strong>Piege frequent :</strong> il n'y a pas d'acteur qui a systematiquement « raison » ou « tort ». Chaque acteur defend une intention legitime de son point de vue ; c'est justement cette diversite d'intentions legitimes qui cree le conflit d'usage.
    </div>
  `

    <table class="data">
      <tr><th>Acteur</th><th>Intention</th></tr>
      <tr><td>Gestionnaire de l'aeroport, compagnies aeriennes</td><td>Maintenir et developper le trafic aerien, source d'emplois et d'activite economique.</td></tr>
      <tr><td>Habitants des communes survolees</td><td>Reduire les nuisances sonores et ameliorer leur qualite de vie.</td></tr>
      <tr><td>Autorites regionales et communales</td><td>Arbitrer entre developpement economique et bien-etre de la population, parfois avec des interets regionaux divergents.</td></tr>
    </table>
    <div class="callout">
      Ce cas montre qu'un amenagement (l'aeroport) qui favorise clairement le <strong>developpement</strong> economique (emplois, connexions internationales) peut en meme temps degrader la qualite de vie d'une partie de la population : c'est un conflit d'usage qui dure depuis des decennies, precisement parce qu'aucune solution ne satisfait pleinement tous les acteurs.
    </div>
  `,

      markers: [ {lon:4.48, lat:50.90, color:'#a3283f', r:14, label:'Bruxelles-National', dx:20, dy:0} ]
    });
  }
},

  html: `
    <p>A l'inverse, certains amenagements sont concus des le depart pour limiter les conflits d'usage et repondre a un enjeu de developpement durable. C'est le cas des <strong>parcs eoliens offshore</strong> installes dans la partie belge de la mer du Nord.</p>

    </div>
    <p><strong>Tu as termine la theorie de ce module.</strong> Passe maintenant a l'entrainement.</p>
  `
}

  },
  { type:'match', points:4,

      <tr><td>Gestionnaire de l'aeroport</td><td>Developper le trafic aerien</td></tr>
      <tr><td>Habitants survoles</td><td>Reduire les nuisances sonores</td></tr></table>`,
    subquestions:[
      {prompt:"Quelle est l'intention principale du gestionnaire de l'aeroport ?", accepted:["developper le trafic","developper le trafic aerien","trafic aerien"]},

  { type:'open', points:3,

      <tr><td>Gestionnaire de l'aeroport</td><td>Developper le trafic aerien</td></tr>
      <tr><td>Habitants survoles</td><td>Reduire les nuisances sonores</td></tr></table>`,
    subquestions:[
