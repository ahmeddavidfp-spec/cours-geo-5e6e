  html: `
    <p>Une <strong>migration</strong> est un deplacement durable d'une personne ou d'un groupe de personnes d'un lieu vers un autre. En geographie, on distingue surtout la migration <strong>internationale</strong> (qui franchit une frontiere entre deux pays) de la migration <strong>interne</strong> (a l'interieur d'un meme pays, par exemple de la campagne vers la ville).</p>
