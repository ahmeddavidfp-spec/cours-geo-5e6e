    <div class="callout">
      <strong>A la fin de ce module, tu seras capable de :</strong>
      <ul class="clean">

      <tr><td><strong class="term" data-def="Une vulnerabilite, c'est un risque ou une fragilite qu'un amenagement peut aggraver, une fois construit.">Vulnerabilite</strong></td><td>Quel risque ou quelle fragilite cet amenagement peut-il aggraver ?</td></tr>

  `

{
  title: "5. La demarche pour justifier un amenagement",
  html: `
    <p>Face a n'importe quel amenagement a justifier, suis cette demarche en quatre etapes.</p>
    <ol class="clean">
      <li><strong>Identifier le besoin</strong> : quelle fonction est mal desservie, ou quel enjeu (ressource, risque, flux) justifie l'amenagement ?</li>
      <li><strong>Analyser le site</strong> : quels sont ses atouts et ses contraintes pour accueillir cet amenagement ?</li>
      <li><strong>Anticiper les consequences</strong> : quelles potentialites et quelles vulnerabilites cet amenagement va-t-il creer pour le territoire ?</li>
      <li><strong>Conclure de maniere nuancee</strong> : l'amenagement se justifie-t-il, sous quelles conditions, avec quelles limites ?</li>
    </ol>

      <strong>Exemple de phrase bien construite :</strong> « L'extension du port d'Anvers s'appuie sur un atout majeur, l'acces direct a la mer du Nord, mais se heurte a la contrainte de l'espace disponible pres d'une grande ville ; elle presente la potentialite de renforcer l'emploi et le role commercial de la Belgique, tout en presentant une vulnerabilite pour les ecosystemes de l'estuaire. »

  `
},

  {kind:'belgium', prompt:"Clique sur la Region flamande (ou se trouve le port d'Anvers).", region:'Flandre'},
  {kind:'world', prompt:"Rappel module 2 : clique sur Rotterdam, tout pres d'Anvers.", lon:4.5, lat:51.9, tol:16,
    crop:{ lonMin:-4, lonMax:10, latMin:48, latMax:54 }}
];

const exerciseBank = [
  { type:'mcq', points:1,
    prompt:"Un atout, dans la demarche de justification d'un amenagement, concerne :",
    options:["les consequences futures de l'amenagement","un element du site qui favorise l'amenagement","uniquement le cout financier","le nombre d'habitants concernes"],

    tableHtml:`<table class="data"><tr><th>Etape</th><th>Question</th></tr>

    prompt:"Explique, en 4 a 5 phrases, pourquoi la demarche de justification d'un amenagement doit toujours mobiliser les quatre concepts (atout, contrainte, potentialite, vulnerabilite) plutot qu'un seul.",

    modelAnswer:"Justifier un amenagement uniquement par ses atouts ou uniquement par ses contraintes donnerait une vision incomplete et biaisee de la situation. Le concept d'atout met en evidence ce qui rend le site favorable, tandis que la contrainte signale ce qui le complique : les deux sont necessaires pour comprendre le choix du site. De la meme maniere, la potentialite montre les benefices attendus de l'amenagement, tandis que la vulnerabilite signale les risques qu'il peut aggraver. En croisant ces quatre concepts, on obtient une analyse nuancee qui permet de juger si un amenagement se justifie, et sous quelles conditions, plutot qu'une conclusion simpliste et unilaterale."
